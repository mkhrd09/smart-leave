<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART LEAVE</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h1>SMART LEAVE</h1>
  <p>ระบบบริหารจัดการการลา</p>
  <p>โรงเรียนมัธยมวัดเขาสุกิม</p>
  <p id="loginStatus">กำลังตรวจสอบสถานะ LINE...</p>
  <script>
  async function startLIFF() {
    try {
      await liff.init({
        liffId: "2012308315-czJfVEE0"
      });

      if (liff.isLoggedIn()) {
        console.log("LINE Login สำเร็จ");
        const idToken = liff.getIDToken();

console.log(
  idToken
    ? "พบ LINE ID Token"
    : "ไม่พบ LINE ID Token"
);
        document.getElementById("loginStatus").textContent = "เข้าสู่ระบบ LINE สำเร็จ";
      } else {
        console.log("ยังไม่ได้เข้าสู่ระบบ LINE");
        document.getElementById("loginStatus").textContent = "ยังไม่ได้เข้าสู่ระบบ LINE";
      }
    } catch (error) {
      console.error("LIFF Error:", error);
    }
  }

  startLIFF();
</script>
</body>
</html>
